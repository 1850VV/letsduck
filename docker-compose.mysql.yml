# Server mode: combine with docker-compose.yml. MySQL has no public host port.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: doodleduck
      MYSQL_USER: duck
      MYSQL_PASSWORD: "${DUCK_MYSQL_PASSWORD:?Set DUCK_MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DUCK_MYSQL_ROOT_PASSWORD:?Set DUCK_MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h127.0.0.1 -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  backend:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DUCK_DB_ENGINE: mysql
      DUCK_EDITION: server
      DUCK_DB_HOST: mysql
      DUCK_DB_PORT: "3306"
      DUCK_DB_USER: duck
      DUCK_DB_PASSWORD: "${DUCK_MYSQL_PASSWORD:?Set DUCK_MYSQL_PASSWORD}"
      DUCK_DB_NAME: doodleduck
  frontend:
    ports: !override
      - "${DUCK_BIND:-0.0.0.0}:${DUCK_PORT:-8080}:80"
volumes:
  mysql-data:

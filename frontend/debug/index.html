<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title data-i18n="debug.copy.001">调试鸭</title><link rel="stylesheet" href="manager.css"></head>
<body>
<header class="top"><a class="brand" href="/" data-brand-slot></a><span class="nav-label" data-i18n="debug.copy.001">调试鸭</span></header>
<main class="workspace">
 <div class="work-bar"><nav class="work-tabs" aria-label="调试功能" data-i18n-aria-label="debug.copy.176"><button data-workbench="control" aria-pressed="true" data-i18n="debug.copy.120">控制</button><button data-workbench="check" aria-pressed="false" data-i18n="debug.copy.268">舵机质检</button><button data-workbench="checkup" aria-pressed="false" data-i18n="debug.copy.282">体检</button><a class="sim-link" href="/sim/" data-i18n="debug.copy.269">仿真</a><button data-workbench="servo" aria-pressed="false" data-i18n="debug.copy.270">设置</button></nav><div class="connection"><div id="battery" class="battery" hidden></div><button id="board-state" class="link-chip" aria-expanded="false" aria-controls="link-pop"><i class="dot"></i></button><div id="link-pop" class="link-pop" hidden></div><b id="online-count"></b><button id="release-all" data-i18n="debug.mode.off">全部放松</button></div></div>
 <div class="layout">
  <section class="model-column" aria-label="舵机三维视窗" data-i18n-aria-label="debug.copy.177">
   <div class="view-bar"><nav class="tabs settings-tabs" aria-label="设置" data-i18n-aria-label="debug.copy.270"><button data-workbench="servo" aria-pressed="true" data-i18n="debug.copy.160">单个舵机</button><button data-workbench="automatic" aria-pressed="false" data-i18n="debug.auto.title">自动编号</button><button data-workbench="calibrate" aria-pressed="false" data-i18n="debug.copy.240">零点校准</button></nav><span class="camera-buttons"><button class="text-button" data-camera="front" data-i18n="debug.copy.241">正面</button><button class="text-button" data-camera="side" data-i18n="debug.copy.242">侧面</button><button class="text-button" id="reset-camera" data-i18n="debug.copy.182">重置视角 ↗</button></span></div>
   <div class="stage"><div id="viewport"></div><div id="labels"></div><div class="stage-top"><span id="stage-caption" data-i18n="debug.copy.067">按编号对应安装位</span><span class="legend"><i class="dot green"></i><span data-i18n="debug.copy.183">当前在线</span> <i class="outline"></i><span data-i18n="debug.copy.184">选中</span></span></div><div id="loading" data-i18n="debug.copy.185">正在载入现有3D模型…</div><div class="stage-bottom" id="stage-help" data-i18n="debug.copy.071">拖动旋转 · 滚轮缩放 · 点舵机查看参数</div></div>
   <section class="inventory" aria-label="板卡与舵机卡槽" data-i18n-aria-label="debug.copy.186"><div class="inventory-title"><b data-i18n="debug.copy.187">舵机配置台</b><button id="scan-servos" data-i18n="debug.copy.188">扫描0–253</button><button id="stop-scan" hidden data-i18n="debug.copy.189">停止扫描</button><span id="slot-count"></span></div><div id="scan-progress-box" hidden><progress id="scan-progress" max="254" value="0"></progress><span id="scan-status"></span></div><div id="slots"></div><div id="extra-devices" hidden></div><div class="inventory-actions"><span data-i18n="debug.copy.190">绿色在线 · ✓ 编号已验证</span><button id="batch-swap" data-i18n="debug.copy.056">左右腿互换</button><button id="batch-custom" data-i18n="debug.copy.057">自定义改号</button></div><div class="numbering-progress"><span id="numbering-progress"></span><button id="verify-online" data-i18n="debug.copy.191">核验在线编号</button></div></section>
   <section class="dropouts" id="dropouts" hidden></section>
  </section>
  <aside class="panel" id="panel" aria-label="选中舵机参数" data-i18n-aria-label="debug.copy.192"></aside>
 </div>
 <div id="feedback" role="status" aria-live="polite"></div>
</main>
<script type="module" src="entry.ts"></script>
</body></html>

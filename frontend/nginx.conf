server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;  # 3MF export uploads 13 rendered plate thumbnails

    location /api/ {
        proxy_pass http://backend:8876;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Both HTTP entry points consult the backend's edition. Personal mode never
    # serves the gallery, including direct /gallery/index.html and module URLs.
    location = /_duck_gallery_access {
        internal;
        proxy_pass http://backend:8876/api/gallery-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /gallery { return 302 /gallery/; }
    location ^~ /gallery/ {
        auth_request /_duck_gallery_access;
        error_page 403 = @duck_personal_home;
        try_files $uri $uri/ =404;
        types { text/javascript mjs js; text/html html; text/css css; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location @duck_personal_home { return 302 /; }

    # Separately licensed model and filament data, mounted read-only from ./assets on the host.
    location /assets/ {
        alias /assets/;
        types { application/json json; application/octet-stream bin 3mf; }
        location ~ \.3mf$ { return 404; }
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:mjs|js)$ {
        types { text/javascript mjs js; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}

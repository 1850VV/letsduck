# No Brotli module is required: the position pack has build-time sidecars.
# Explicit q=0 takes precedence, including duplicated coding tokens. Unknown
# codings and wildcards conservatively use the identity representation.
map $http_accept_encoding $duck_br_file {
    default "";
    "~*(^|,)\s*br\s*;\s*q=0(?:\.0*)?\s*(,|$)" "";
    "~*(^|,)\s*br\s*(?:;\s*q=(?:1(?:\.0*)?|0\.\d+))?\s*(,|$)" /assets/geometry.positions.bin.br;
}
map $http_accept_encoding $duck_gzip_file {
    default "";
    "~*(^|,)\s*gzip\s*;\s*q=0(?:\.0*)?\s*(,|$)" "";
    "~*(^|,)\s*gzip\s*(?:;\s*q=(?:1(?:\.0*)?|0\.\d+))?\s*(,|$)" /assets/geometry.positions.bin.gz;
}
map $uri $duck_asset_encoding {
    default "";
    /assets/geometry.positions.bin.br br;
    /assets/geometry.positions.bin.gz gzip;
}
# The same negotiation for the release build's code (build.mjs writes .br/.gz siblings).
# An empty value is no file, so try_files moves on to the next representation.
map $http_accept_encoding $duck_build_br {
    default "";
    "~*(^|,)\s*br\s*;\s*q=0(?:\.0*)?\s*(,|$)" "";
    "~*(^|,)\s*br\s*(?:;\s*q=(?:1(?:\.0*)?|0\.\d+))?\s*(,|$)" $uri.br;
}
map $http_accept_encoding $duck_build_gzip {
    default "";
    "~*(^|,)\s*gzip\s*;\s*q=0(?:\.0*)?\s*(,|$)" "";
    "~*(^|,)\s*gzip\s*(?:;\s*q=(?:1(?:\.0*)?|0\.\d+))?\s*(,|$)" $uri.gz;
}
map $uri $duck_build_encoding {
    default "";
    ~\.br$ br;
    ~\.gz$ gzip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;  # 3MF export uploads 13 rendered plate thumbnails

    # Text, translations and the 5.8 MB model geometry compress well; this matters most on phones.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/octet-stream image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8876;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # a 3MF export waits for a free export worker
    }

    # Separately licensed model and filament data, mounted read-only from ./assets on the host.
    # It changes only when the asset pack is replaced, so returning visitors keep the 3 MB model
    # for 7 days; after that the browser revalidates (ETag / Last-Modified, usually a 304).
    location = /assets/geometry.positions.bin {
        root /;
        # try_files updates $uri only for a file that exists. This keeps the
        # Content-Encoding header correct if either sidecar is missing.
        try_files $duck_br_file $duck_gzip_file $uri =404;
        gzip off;
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding $duck_asset_encoding;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        alias /assets/;
        gzip_static on;
        types { application/json json; application/octet-stream bin 3mf; }
        location ~* \.3mf(?:\.(?:br|gz))?$ { return 404; }
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    # Code from the release build: content-hashed names never change, so browsers keep them for a
    # year without asking again. try_files moves $uri to a sidecar only when it exists, so the
    # encoding header follows the file actually sent; the type comes from the requested name.
    location ^~ /build/ {
        gzip off;
        location ~ \.js$ {
            try_files $duck_build_br $duck_build_gzip $uri =404;
            types { }
            default_type text/javascript;
            add_header Content-Encoding $duck_build_encoding;
            add_header Vary Accept-Encoding always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ \.css$ {
            try_files $duck_build_br $duck_build_gzip $uri =404;
            types { }
            default_type text/css;
            add_header Content-Encoding $duck_build_encoding;
            add_header Vary Accept-Encoding always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}

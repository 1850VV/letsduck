server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;  # 3MF export uploads 13 rendered plate thumbnails

    # Text, translations and the 5.8 MB model geometry compress well; this matters most on phones.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/octet-stream image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8876;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # a 3MF export waits for a free export worker
    }

    # Separately licensed model and filament data, mounted read-only from ./assets on the host.
    location /assets/ {
        alias /assets/;
        types { application/json json; application/octet-stream bin 3mf; }
        location ~ \.3mf$ { return 404; }
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:mjs|js)$ {
        types { text/javascript mjs js; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}

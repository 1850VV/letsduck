server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;  # 3MF export uploads 13 rendered plate thumbnails

    location /api/ {
        proxy_pass http://backend:8876;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Separately licensed model and filament data, mounted read-only from ./assets on the host.
    location /assets/ {
        alias /assets/;
        types { application/json json; application/octet-stream bin 3mf; }
        location ~ \.3mf$ { return 404; }
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:mjs|js)$ {
        types { text/javascript mjs js; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}

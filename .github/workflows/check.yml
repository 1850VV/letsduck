name: Public source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: duck_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci-test-password --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DUCK_TEST_DATABASE_URL: mysql+pymysql://root:ci-test-password@127.0.0.1:3306/duck_test_ci?charset=utf8mb4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Personal edition with no third-party packages installed
        run: |
          python3 -I -m unittest discover -s tests -p test_personal.py -v
          python3 -I -m unittest discover -s tests -p test_stamp.py -v
          python3 -I -m unittest discover -s tests -p test_pack_geometry.py -v
          python3 -I -m compileall -q personal run.py frontend/stamp.py scripts/pack_geometry.py backend/rules.py backend/errors.py backend/exporter.py
      - name: Install pinned backend and test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Check publication boundary
        run: python3 scripts/publication_audit.py
      - name: Real filament rules without licensed assets
        run: |
          node --test tests/filaments.test.mjs
          python3 -I -m unittest discover -s tests -p test_filaments.py -v
          python3 -I -m unittest discover -s tests -p test_material_profiles.py -v
      - name: Test local asset importer and the account store with synthetic fixtures
        run: |
          python3 -m unittest discover -s tests -p test_local_assets.py -v
          python3 -m unittest discover -s tests -p test_assembly_import.py -v
          python3 -m unittest discover -s tests -p test_store.py -v
          python3 -m unittest discover -s tests -p test_api.py -v
          python3 -m unittest discover -s tests -p test_store_scaling.py -v
          python3 -m unittest discover -s tests -p test_export_queue.py -v
          python3 -m unittest discover -s tests -p test_migration.py -v
          python3 -m unittest discover -s tests -p test_startup.py -v
          python3 -m unittest discover -s tests -p test_mysql.py -v
      - name: Performance unit contracts without licensed assets
        run: |
          node --test tests/test_positions.mjs tests/test_model_loader.mjs tests/test_render_policy.mjs tests/test_hover_queue.mjs
          python3 -I -m unittest discover -s tests -p test_zip_reuse.py -v
          python3 -I -m unittest discover -s tests -p test_export_transport_unit.py -v
      - name: Assembly guide logic without licensed assets
        # cable-clearance and hardware-models read the local assembly models (scripts/import_assembly_assets.py).
        run: node --test $(ls tests/assembly/*.test.mjs | grep -v -e cable-clearance -e hardware-models)
      - name: Debug duck controller and shared servo numbering
        run: |
          python3 -I -m unittest discover -s tests -p test_duck_debug.py -v
          node --test tests/duck-debug.test.mjs tests/servo-map.test.mjs tests/servo-preparation.test.mjs
      - name: Verify precompressed asset delivery with native nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          DUCK_NGINX_BIN=/usr/sbin/nginx python3 -I -m unittest discover -s tests -p test_nginx_assets.py -v
      - name: Check Python and browser module syntax
        run: |
          python3 -m compileall -q backend personal run.py
          for file in frontend/lib/*.mjs frontend/shared/*.mjs frontend/studio/studio.mjs frontend/gallery/gallery.mjs frontend/home/*.mjs frontend/locales/*.mjs frontend/assemble/*.mjs frontend/assemble/full/*.mjs frontend/debug/*.mjs; do
            node --check "$file"
          done
      - name: State the validation boundary
        run: echo "Real-model export and browser checks need a separately licensed local asset pack and are not run in public CI."

name: Public source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: duck_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci-test-password --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DUCK_TEST_DATABASE_URL: mysql://root:ci-test-password@127.0.0.1:3306/duck_test_ci?charset=utf8mb4
      DUCK_NGINX_BIN: /usr/sbin/nginx
      DUCK_TEST_BROWSER: '1'
      WEB_STUDIO_BROWSER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked Node workspace dependencies
        run: npm ci
      - name: Strict TypeScript, runtime compatibility and language boundaries
        run: |
          npm run typecheck
          npm run probe:runtime
          npm run audit:typescript
      - name: Install owned managed-browser and native nginx test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          PLAYWRIGHT_SKIP_BROWSER_GC=1 npx playwright install --with-deps chromium
      - name: Node contracts, real MySQL, browser lifecycle and source-only web checks
        run: npm test
      - name: Build and exercise Node server and Vite nginx images
        run: |
          DUCK_TEST_DATABASE_URL= npx tsx tooling/test/server-container.ts
          npx tsx tooling/test/web-container.ts
          DUCK_MYSQL_PASSWORD=ci-compose-password DUCK_MYSQL_ROOT_PASSWORD=ci-root-password docker compose config --quiet
          DUCK_MYSQL_PASSWORD=ci-compose-password DUCK_MYSQL_ROOT_PASSWORD=ci-root-password DUCK_DOMAIN=example.invalid docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
      - name: Check publication boundary
        run: npm run audit:publication
      - name: State the validation boundary
        run: echo "Licensed-model browser, manufacturing, native-control and physical-device checks require their separate local acceptance evidence."

  assembly-diagnostic:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[diagnose-assembly]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Compare fixed legacy and current assembly on Linux
        run: npx tsx tooling/test/assembly-diagnostic.ts .
        env:
          DUCK_ASSEMBLY_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/assembly-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assembly-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/assembly-diagnostic.json*
          retention-days: 1

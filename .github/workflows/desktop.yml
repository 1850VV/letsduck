name: Desktop candidate
on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      asset_release:
        description: 'Optional release tag containing letsduck-assets.zip; empty builds a source-only shell'
        type: string
        required: false
      update_base:
        description: 'Optional public HTTPS update base (platform directories are added)'
        type: string
        required: false
      update_repository:
        description: 'Public binary-only repository, e.g. owner/letsduck-releases'
        type: string
        required: false
      release_version:
        description: 'Optional installed version X.Y.Z-beta.N (otherwise package.json)'
        type: string
        required: false
      target_platform:
        description: 'Build platform'
        type: choice
        options: [all, win32, darwin]
        default: all
      upgrade_from:
        description: 'Run Windows installed A-to-B acceptance instead of building: baseline version'
        type: string
        required: false
      verify_candidate:
        description: 'Recheck an existing Windows candidate Release without rebuilding'
        type: string
        required: false
permissions:
  contents: read
jobs:
  candidate:
    if: inputs.upgrade_from == '' && inputs.verify_candidate == ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
            arch: x64
            target: '--win --x64'
          - os: macos-15
            platform: darwin
            arch: arm64
            target: '--mac --arm64'
          - os: macos-15-intel
            platform: darwin
            arch: x64
            target: '--mac --x64'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
      DUCK_BUILD_ARCH: ${{ matrix.arch }}
      DUCK_UPDATE_BASE: ${{ inputs.update_base }}
      DUCK_UPDATE_REPOSITORY: ${{ inputs.update_repository }}
      DUCK_RELEASE_VERSION: ${{ inputs.release_version }}
      DUCK_PACKAGE_WITHOUT_ASSETS: ${{ inputs.asset_release == '' && '1' || '0' }}
      DUCK_DISTRIBUTABLE_ASSETS: ${{ github.workspace }}/assets
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Select requested platform
        id: selected
        env:
          REQUESTED: ${{ inputs.target_platform }}
          PLATFORM: ${{ matrix.platform }}
        run: echo "build=$([[ -z "$REQUESTED" || "$REQUESTED" == all || "$REQUESTED" == "$PLATFORM" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.selected.outputs.build == 'true'
      - uses: actions/setup-node@v4
        if: steps.selected.outputs.build == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.selected.outputs.build == 'true'
        with:
          python-version: '3.12'
      - run: npm ci --prefix desktop
        if: steps.selected.outputs.build == 'true'
      - run: npm run setup:electron --prefix desktop
        if: steps.selected.outputs.build == 'true'
      - run: npm test --prefix desktop
        if: steps.selected.outputs.build == 'true'
      - name: Download the authorized asset pack
        if: steps.selected.outputs.build == 'true' && inputs.asset_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_RELEASE: ${{ inputs.asset_release }}
        run: |
          gh release download "$ASSET_RELEASE" --pattern letsduck-assets.zip --dir "$RUNNER_TEMP/duck-assets"
          python -m zipfile -e "$RUNNER_TEMP/duck-assets/letsduck-assets.zip" assets
          npm run prepare:assets --prefix desktop
      - name: Real model export compatibility
        if: steps.selected.outputs.build == 'true' && inputs.asset_release != ''
        env:
          DUCK_REAL_ASSETS: ${{ github.workspace }}/assets
        run: npm test --prefix desktop
      - name: Build unsigned development candidate
        if: steps.selected.outputs.build == 'true'
        run: npm run package --prefix desktop -- ${{ matrix.target }}
      - name: Store complete candidates in a private Release
        if: steps.selected.outputs.build == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          directory="desktop/release/$PLATFORM-$ARCH"
          files=("$directory"/*.exe "$directory"/*.dmg "$directory"/*.zip "$directory"/*.blockmap "$directory"/beta*.yml "$directory"/latest*.yml)
          test "${#files[@]}" -gt 0
          tag="desktop-candidate-$GITHUB_RUN_ID-$PLATFORM-$ARCH"
          gh release create "$tag" "${files[@]}" --prerelease --latest=false --target "$GITHUB_SHA" --title "Desktop candidate $DUCK_RELEASE_VERSION ($PLATFORM $ARCH)" --notes "Private CI candidate. Contains only top-level distributable files, not unpacked executables. Not a public update channel."
      - name: Install the complete offline package and exercise its real UI
        id: installed
        if: steps.selected.outputs.build == 'true' && inputs.asset_release != '' && inputs.update_base == '' && inputs.update_repository == ''
        run: |
          npm ci
          node desktop/scripts/installed-smoke.mjs
      - name: Save private installation evidence
        if: always() && steps.installed.outcome != 'skipped' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -d output/desktop-installed-smoke ]; then
            file="output/letsduck-$DUCK_RELEASE_VERSION-$PLATFORM-$ARCH-install-check.zip"
            folders=(output/desktop-installed-smoke)
            if [ -d output/desktop-smoke ]; then folders+=(output/desktop-smoke); fi
            python -m zipfile -c "$file" "${folders[@]}"
            gh release upload "desktop-candidate-$GITHUB_RUN_ID-$PLATFORM-$ARCH" "$file"
          fi
  verify-windows:
    if: inputs.verify_candidate != ''
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DUCK_RELEASE_VERSION: ${{ inputs.release_version }}
      DUCK_BUILD_ARCH: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Download the exact existing private installer
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.verify_candidate }}
        run: gh release download "$CANDIDATE" --pattern "letsduck-$DUCK_RELEASE_VERSION-win-x64.exe" --dir desktop/release/win32-x64
      - run: node desktop/scripts/installed-smoke.mjs
      - name: Store isolated recheck evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d output/desktop-installed-smoke ]; then
            folders=(output/desktop-installed-smoke)
            if [ -d output/desktop-smoke ]; then folders+=(output/desktop-smoke); fi
            python -m zipfile -c output/installed-recheck.zip "${folders[@]}"
            gh release create "desktop-install-evidence-$GITHUB_RUN_ID" output/installed-recheck.zip --prerelease --latest=false --target "$GITHUB_SHA" --title "Private installed Windows recheck $DUCK_RELEASE_VERSION" --notes "Existing installer rechecked without rebuilding; see the attached results."
          fi
  installed-upgrade:
    if: inputs.upgrade_from != ''
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DUCK_UPDATE_REPOSITORY: ${{ inputs.update_repository }}
      DUCK_UPGRADE_FROM: ${{ inputs.upgrade_from }}
      DUCK_UPGRADE_TO: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Install A, download B anonymously, restart and verify retained data
        run: node desktop/scripts/installed-upgrade.mjs
      - name: Save upgrade evidence without Actions artifact storage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -d output/desktop-installed-upgrade ]; then
            python -m zipfile -c output/installed-upgrade-evidence.zip output/desktop-installed-upgrade
            gh release create "desktop-upgrade-evidence-$GITHUB_RUN_ID" output/installed-upgrade-evidence.zip --prerelease --latest=false --target "$GITHUB_SHA" --title "Installed upgrade evidence $GITHUB_RUN_ID" --notes "Private automated acceptance evidence; see result.json or failure.json in the archive."
          fi
